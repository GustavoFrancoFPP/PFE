<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Reprodutor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/Aula-05/Formativa/IMG/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="sidebar">
        <div class="logo-section">
    
 
         <i class="fa-brands fa-instagram"></i>
            <span class="logo-text">Instagram</span>
        </div>
        
        <nav class="nav-menu">
            <a href="#" class="nav-item active"><i class="fas fa-house"></i> <span>Página inicial</span></a>
            <a href="#" class="nav-item"><i class="fas fa-magnifying-glass"></i> <span>Pesquisa</span></a>
            <a href="#" class="nav-item"><i class="far fa-compass"></i> <span>Explorar</span></a>
            <a href="#" class="nav-item"><i class="far fa-paper-plane"></i> <span>Mensagens</span></a>
            <a href="#" class="nav-item"><i class="far fa-heart"></i> <span>Notificações</span></a>
            <a href="#" class="nav-item"><i class="far fa-square-plus"></i> <span>Criar</span></a>
            <a href="#" class="nav-item profile">
                <img src="/Aula-05/Formativa/IMG/perfil principal.jpg" alt="Perfil">
                <span>Perfil</span>
            </a>
        </nav>

        <div class="more-menu">
            <a href="#" class="nav-item"><i class="fas fa-bars"></i> <span>Mais</span></a>
        </div>
    </section>

    <main class="main-container">
        <div class="content-wrapper">
            
            <div class="stories-wrapper">
                <div class="story-item">
                    <div class="story-ring"><img src="/Aula-05/Formativa/IMG/samuel.jpg"></div>
                    <span>Samuel</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><img src="/Aula-05/Formativa/IMG/jeff.jpg"></div>
                    <span>Jefferson</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><img src="/Aula-05/Formativa/IMG/guilherme.jpg"></div>
                    <span>Guilherme</span>
                </div>
            </div

            <section class="feed">
                <article class="post">
                    <div class="post-header">
                        <img src="/Aula-05/Formativa/IMG/jezer (2).jpg" alt="User">
                        <span class="username">Jezer <span class="time">• 2h</span></span>
                        <i class="fas fa-ellipsis"></i>
                    </div>
                    <div class="post-media">
                        <img src="/Aula-05/Formativa/IMG/jezer.jpg" alt="Post">
                    </div>
                    <div class="post-footer">
                        <div class="post-actions">
                            <div class="left-actions">
                                <i class="far fa-heart"></i>
                                <i class="far fa-comment"></i>
                                <i class="far fa-paper-plane"></i>
                            </div>
                            <i class="far fa-bookmark"></i>
                        </div>
                        <div class="likes-count">67 curtidas</div>
                        <div class="caption">
                            <strong>Jezer</strong> Controle e Automação com os cabras de eletro
                        </div>
                    </div>
                </article>

                <article class="post">
                    <div class="post-header">
                        <img src="/Aula-05/Formativa/IMG/reidelas.jpg" alt="User">
                        <span class="username">ReiDelas67 <span class="time">• 5h</span></span>
                        <i class="fas fa-ellipsis"></i>
                    </div>
                    <div class="post-media">
                    <video src="https://videos.pexels.com/video-files/4069480/4069480-sd_640_360_25fps.mp4" autoplay controls style="width:100%; border-radius:3px;"></video>
                    </div>
                    <div class="post-footer">
                        <div class="post-actions">
                            <div class="left-actions">
                                <i class="far fa-heart"></i>
                                <i class="far fa-comment"></i>
                                <i class="far fa-paper-plane"></i>
                            </div>
                            <i class="far fa-bookmark"></i>
                        </div>
                        <div class="likes-count">987 curtidas</div>
                        <div class="caption">
                            <strong>ReiDelas67</strong> Bom dia.
                        </div>
                    </div>
                </article>

                 <article class="post">
                    <div class="post-header">
                        <img src="/Aula-05/Formativa/IMG/reidelas.jpg" alt="User">
                        <span class="username">RenatoSilvaxx <span class="time">• 5h</span></span>
                        <i class="fas fa-ellipsis"></i>
                    </div>
                    <div class="post-media">
                    <video src="/Aula-05/Formativa/IMG/15434445_3840_2160_60fps.mp4" autoplay controls style="width:100%; border-radius:3px;"></video>
                    </div>
                    <div class="post-footer">
                        <div class="post-actions">
                            <div class="left-actions">
                                <i class="far fa-heart"></i>
                                <i class="far fa-comment"></i>
                                <i class="far fa-paper-plane"></i>
                            </div>
                            <i class="far fa-bookmark"></i>
                        </div>
                        <div class="likes-count">4676 curtidas</div>
                        <div class="caption">
                            <strong>RenatoSilvaxx</strong>
                        </div>
                    </div>
                </article>
            </section>
        </div>
    </main>

</body>
</html>
